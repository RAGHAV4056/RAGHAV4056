
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1200" height="430"
     viewBox="0 0 1200 430"
     fill="none">

  <defs>
    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="430">
      <stop stop-color="#101010"/>
      <stop offset="1" stop-color="#19130F"/>
    </linearGradient>

    <!-- Orange gradient -->
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FF9A45"/>
      <stop offset="1" stop-color="#FF5A00"/>
    </linearGradient>

    <!-- Bottom glow -->
    <linearGradient id="line" x1="0" y1="0" x2="1200" y2="0">
      <stop stop-color="#FF6B00" stop-opacity="0"/>
      <stop offset=".5" stop-color="#FF6B00"/>
      <stop offset="1" stop-color="#FF6B00" stop-opacity="0"/>
    </linearGradient>

    <!-- Grid pattern -->
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32"
            stroke="#FFFFFF"
            stroke-opacity=".045"
            fill="none"/>
    </pattern>

    <!-- Glow -->
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Profile image clipping -->
    <clipPath id="profileClip">
      <circle cx="0" cy="0" r="105"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="430" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="430" rx="18" fill="url(#grid)"/>

  <!-- Background orange glow -->
  <circle cx="970" cy="200" r="220" fill="#FF6B00" opacity=".045">
    <animate attributeName="opacity"
             values=".025;.09;.025"
             dur="5s"
             repeatCount="indefinite"/>
  </circle>

  <!-- Top and bottom borders -->
  <path d="M0 1H1200" stroke="#FF6B00" stroke-opacity=".5"/>
  <path d="M0 429H1200" stroke="#FF6B00" stroke-opacity=".35"/>

  <!-- Header -->
  <g font-family="monospace" font-size="12" fill="#888888">
    <circle cx="34" cy="32" r="5" fill="#FF5F57"/>
    <circle cx="52" cy="32" r="5" fill="#FEBC2E"/>
    <circle cx="70" cy="32" r="5" fill="#28C840"/>

    <text x="92" y="36">RAGHAV4056 / DEVELOPER PROFILE</text>
    <text x="1015" y="36" fill="#FF8A35">SYSTEM ONLINE</text>
  </g>

  <path d="M45 58H1155"
        stroke="#FFFFFF"
        stroke-opacity=".1"/>

  <!-- LEFT CONTENT -->
  <g transform="translate(68 113)">

    <text font-family="monospace"
          font-size="13"
          fill="#FF8A35"
          letter-spacing="3">
      HELLO, WORLD. I'M
    </text>

    <text x="0" y="77"
          font-family="Arial, Helvetica, sans-serif"
          font-size="66"
          font-weight="800"
          letter-spacing="-2"
          fill="#FFFFFF">
      RAGHAV
    </text>

    <text x="0" y="139"
          font-family="Arial, Helvetica, sans-serif"
          font-size="66"
          font-weight="800"
          letter-spacing="-2"
          fill="url(#orange)">
      SHARMA.
    </text>

    <text x="2" y="180"
          font-family="monospace"
          font-size="15"
          fill="#D0D0D0">
      Developer. Problem Solver. Creator.
    </text>

    <text x="2" y="211"
          font-family="monospace"
          font-size="13"
          fill="#929292">
      B.Tech CSE  /  JIIT '29
    </text>

    <!-- Status box -->
    <g transform="translate(0 249)">
      <rect width="205" height="36"
            rx="6"
            fill="#FF6B00"
            fill-opacity=".09"
            stroke="#FF6B00"
            stroke-opacity=".5"/>

      <circle cx="17" cy="18" r="4"
              fill="#FF7A18"
              filter="url(#glow)">
        <animate attributeName="opacity"
                 values="1;.35;1"
                 dur="1.8s"
                 repeatCount="indefinite"/>
      </circle>

      <text x="30" y="22"
            font-family="monospace"
            font-size="11"
            fill="#FF9A45">
        OPEN TO BUILDING
      </text>
    </g>

  </g>

  <!-- RIGHT SIDE: PROFILE IMAGE -->
  <g transform="translate(920 215)">

    <!-- Outer animated ring -->
    <circle cx="0" cy="0" r="126"
            stroke="#FF6B00"
            stroke-opacity=".55"
            stroke-width="2"
            fill="none">

      <animate attributeName="r"
               values="118;130;118"
               dur="4s"
               repeatCount="indefinite"/>

      <animate attributeName="opacity"
               values=".4;1;.4"
               dur="4s"
               repeatCount="indefinite"/>
    </circle>

    <!-- Rotating dashed ring -->
    <circle cx="0" cy="0" r="114"
            stroke="#FF8A35"
            stroke-opacity=".8"
            stroke-width="1.5"
            fill="none"
            stroke-dasharray="8 7">

      <animateTransform attributeName="transform"
                        type="rotate"
                        from="0"
                        to="360"
                        dur="30s"
                        repeatCount="indefinite"/>
    </circle>

    <!-- Image background -->
    <circle cx="0" cy="0" r="109"
            fill="#242424"
            stroke="#FF6B00"
            stroke-width="3"/>

    <!-- Actual profile picture -->
    <image
      xlink:href="profile.jpg"
      href="profile.jpg"
      x="-105"
      y="-105"
      width="210"
      height="210"
      preserveAspectRatio="xMidYMid slice"
      clip-path="url(#profileClip)"/>

    <!-- Image border -->
    <circle cx="0" cy="0" r="106"
            stroke="#FF9A45"
            stroke-opacity=".7"
            stroke-width="1.5"
            fill="none"/>

    <!-- Floating status indicator -->
    <circle cx="78" cy="-83" r="7"
            fill="#FF6B00"
            filter="url(#glow)">
      <animate attributeName="r"
               values="6;9;6"
               dur="2s"
               repeatCount="indefinite"/>
    </circle>

    <!-- Small decorative dot -->
    <circle cx="-112" cy="65" r="4"
            fill="#FF8A35">
      <animate attributeName="opacity"
               values=".3;1;.3"
               dur="2.5s"
               repeatCount="indefinite"/>
    </circle>

  </g>

  <!-- Caption under profile -->
  <text x="920" y="370"
        text-anchor="middle"
        font-family="monospace"
        font-size="13"
        letter-spacing="2"
        fill="#FF8A35">
    RAGHAV / DEVELOPER
  </text>

  <!-- Bottom tagline -->
  <text x="68" y="383"
        font-family="monospace"
        font-size="11"
        fill="#777777"
        letter-spacing="1">
    DSA  /  FULL-STACK  /  SYSTEMS  /  AI &amp; ML
  </text>

  <!-- Animated bottom line -->
  <rect x="0" y="423"
        width="1200"
        height="3"
        fill="url(#line)">
    <animate attributeName="opacity"
             values=".3;1;.3"
             dur="3s"
             repeatCount="indefinite"/>
  </rect>

  <!-- Floating decorative animation -->
  <g transform="translate(1135 90)" opacity=".7">

    <circle cx="0" cy="0" r="3" fill="#FF6B00">
      <animate attributeName="cy"
               values="0;12;0"
               dur="4s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="0" cy="0" r="13"
            stroke="#FF6B00"
            stroke-opacity=".5">

      <animate attributeName="r"
               values="10;25;10"
               dur="4s"
               repeatCount="indefinite"/>

      <animate attributeName="opacity"
               values=".6;0;.6"
               dur="4s"
               repeatCount="indefinite"/>
    </circle>

  </g>

</svg>
